worker_processes  auto;

error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;


events {
    worker_connections  1024;
}


http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Стандартный формат для обратной совместимости
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # Структурированный JSON формат для access логов
    log_format json_combined escape=json
      '{'
        '"@timestamp":"$time_iso8601",'
        '"level":"info",'
        '"service":"<<SERVICE>>",'
        '"type":"access",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_addr":"$upstream_addr",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$request_id",'
        '"http_x_request_id":"$http_x_request_id",'
        '"correlation_id":"$http_x_correlation_id",'
        '"server_name":"$server_name",'
        '"host":"$host",'
        '"scheme":"$scheme",'
        '"request_length":$request_length,'
        '"connection":$connection,'
        '"connection_requests":$connection_requests'
      '}';

    # Расширенный JSON формат с дополнительными метриками
    log_format json_detailed escape=json
      '{'
        '"@timestamp":"$time_iso8601",'
        '"level":"info",'
        '"service":"<<SERVICE>>",'
        '"type":"access",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"request_id":"$request_id",'
        '"http_x_request_id":"$http_x_request_id",'
        '"correlation_id":"$http_x_correlation_id",'
        '"server_name":"$server_name",'
        '"host":"$host",'
        '"scheme":"$scheme",'
        '"request_length":$request_length,'
        '"connection":$connection,'
        '"connection_requests":$connection_requests,'
        '"http_origin":"$http_origin",'
        '"content_type":"$content_type",'
        '"gzip_ratio":"$gzip_ratio"'
      '}';

    # Формат для глубокой отладки (включает тело, заголовки и Location для редиректов)
    log_format json_debug escape=json
      '{'
        '"@timestamp":"$time_iso8601",'
        '"service":"<<SERVICE>>",'
        '"level":"debug",'
        '"type":"access",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"request":"$request",'
        '"request_length":$request_length,'
        '"bytes_sent":$bytes_sent,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"status":$status,'
        '"connection":$connection,'
        '"connection_requests":$connection_requests,'
        '"gzip_ratio":"$gzip_ratio",'
        '"host":"$host",'
        '"server_name":"$server_name",'
        '"scheme":"$scheme",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"http_user_agent":"$http_user_agent",'
        '"http_referer":"$http_referer",'
        '"http_origin":"$http_origin",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"http_x_request_id":"$http_x_request_id",'
        '"http_x_correlation_id":"$http_x_correlation_id",'
        '"http_authorization":"$http_authorization",'
        '"http_cookie":"$http_cookie",'
        '"http_x_csrf_token":"$http_x_csrf_token",'
        '"sent_http_location":"$sent_http_location",'
        '"content_type":"$content_type"'
      '}';

    # Используем структурированный JSON формат
    access_log  /dev/stdout json_combined;
    # access_log  /dev/stdout json_detailed
    # access_log  /dev/stdout json_debug;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    include /etc/nginx/conf.d/upstream.conf;
    include /etc/nginx/conf.d/runtime.conf;
}
